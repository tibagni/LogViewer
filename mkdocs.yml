site_name: LogViewer
site_description: An easy-to-use tool to analyze Android logs, multi-file bugreports, and live logcat streams.
site_author: Tiago Bagni
site_url: https://tibagni.github.io/LogViewer/
repo_name: tibagni/LogViewer
repo_url: https://github.com/tibagni/LogViewer

copyright: Copyright &copy; 2017-2026 Tiago Bagni. Distributed under the MIT License.

theme:
  name: material
  logo: images/logo.svg
  favicon: images/logo.svg
  palette:
    # Palette toggle for automatic mode
    - media: "(prefers-color-scheme)"
      toggle:
        icon: material/brightness-auto
        name: Switch to light mode

    # Palette toggle for light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode

    # Palette toggle for dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to system preference

  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - attr_list
  - md_in_html
  - tables

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - User Guide:
    - Viewing & Analyzing Logs: analyzing-logs.md
    - Filters & Groups: filters-panel.md
    - Filter & Regex Editor: filter-editor.md
    - '"My Logs" Bookmarks': my-logs.md
    - Live Logcat Streaming: live-logs.md
    - Bug Report Analysis: bugreport.md
    - Log Streams & Merging: log-streams.md
    - Limiting Time Window: limiting-time-window.md
  - Reference:
    - Keyboard Shortcuts: shortcuts.md
    - Download: download.md

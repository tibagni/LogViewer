# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
version: 2
language: "en-US"

reviews:
  profile: "assertive"
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "master"

  path_instructions:
    - path: "src/main/**"
      instructions: |
        You are reviewing the LogViewer desktop application (Kotlin/Java Swing).
        Strictly enforce the following architectural rules:
        1. Architecture (MVP):
           - Presenters must NEVER import or reference Swing/AWT classes (e.g., JPanel, Color, Font, JTable).
           - Views must remain passive and delegate all business logic to Presenters.
           - Repositories are the single source of truth for domain data.
        2. Concurrency & Threading:
           - All Swing UI mutations and TableModel notifications MUST occur on the Event Dispatch Thread (EDT) via Dispatchers.Main.
           - Long-running I/O, ADB commands, and regex filtering must run off the EDT (Dispatchers.IO or Dispatchers.Default).
           - Guard against race conditions and lock contention in repositories (ensure circular buffer and filtered log collections stay strictly synchronized).
        3. Memory & High Throughput:
           - Bounded collections must be used for streaming logs to prevent OutOfMemoryError.
           - Ensure child processes (like adb) are cleanly stopped without leaving orphaned processes.
        4. Localization (i18n):
           - No hardcoded user-facing strings in UI components. All user-visible text must use I18n.get(...) or have // i18n:ignore if technical/non-translatable.

    - path: "src/test/**"
      instructions: |
        - Ensure tests verify behavioral contracts rather than trivial mock setups.
        - Verify coroutine tests use runBlocking or standard test dispatchers properly.

chat:
  auto_reply: true

name: CI

on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up JDK 11
        uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'temurin'
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      - name: Run I18n script tests
        run: python3 -m unittest discover -s scripts -p "test_*.py"
      - name: Validate I18n resource bundle
        run: python3 scripts/check_i18n.py --validate-bundle
      - name: Check for hardcoded UI strings in PR diff
        if: github.event_name == 'pull_request'
        run: python3 scripts/check_i18n.py --diff origin/${{ github.base_ref }}
      - name: Build with Gradle
        run: ./gradlew build
      - name: Upload test report
        run: ./gradlew jacocoTestReport coveralls
        env:
          COVERALLS_REPO_TOKEN: ${{ secrets.COVERALLS_REPO_TOKEN }}
